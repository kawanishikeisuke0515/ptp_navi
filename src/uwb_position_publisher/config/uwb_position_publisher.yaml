uwb_position_publisher:
  ros__parameters:
    uwb_distances_topic: "/uwb/distances"
    uwb_position_topic: "/uwb/position"
    anchor_1_x: -0.67
    anchor_1_y: -3.62
    anchor_2_x: 6.18
    anchor_2_y: -3.63
    anchor_3_x: 3.57
    anchor_3_y: 1.86
    # Tag height minus each anchor height [m]; negative values are allowed.
    anchor_1_height_difference_m: -1.3
    anchor_2_height_difference_m: -1.3
    anchor_3_height_difference_m: -1.3
    # Refine the linear estimate by minimizing squared 3D range errors.
    # Set at startup; false preserves the original calculation.
    use_least_squares: false
    moving_average_window: 5
